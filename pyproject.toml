[project]
name = "nlp-projects"
version = "0.1.0"
description = "NLP projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
